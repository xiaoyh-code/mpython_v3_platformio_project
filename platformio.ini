[platformio]
default_envs = mpython_esp32s3_r8n16

[env:mpython_esp32s3_r8n16]
platform = espressif32
board = mpython_esp32s3_r8n16
framework = arduino
lib_deps =
  moononournation/GFX Library for Arduino @ 1.6.0
  bodmer/TJpg_Decoder @ ^1.1.0
board_build.variants_dir = variants
board_build.partitions = partitions/mpython_esp32S3_16MBapp.csv
upload_port = /dev/cu.usbmodem21301
upload_speed = 115200
upload_flags = --no-stub
monitor_port = /dev/cu.usbmodem21301
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
debug_tool = esp-builtin
debug_init_break = tbreak setup
